<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Print render: Exhibit B, the Distance Record</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../site.css">
<script src="../app.js" defer></script>
<style>
  body { padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og-frame { padding: 24px 32px 0; }
  .og-head { font-family: var(--mono); font-size: 14px; color: var(--ink-2); display: flex; justify-content: space-between; }
  .og-head .t { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div class="og-frame">
  <div class="og-head">
    <span><span class="t">THE INTERCONNECT PREMIUM</span> / EXHIBIT B: THE DISTANCE RECORD</span>
    <span>RICHARD TREVOR / AS OF 2026-07-25</span>
  </div>
  <div id="og-c" style="width:1136px"></div>
</div>
<script>
  window.addEventListener("load", function () {
    var target = document.getElementById("og-c");
    var u = window.IP.buildExhibitC(target);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { u.redraw(); });
    }
  });
</script>
</body>
</html>
