name: daily-pull

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test collector
        run: python -m unittest discover -s tests
      - name: Pull daily aggregate
        run: python scripts/pull_premium.py
      - name: Validate aggregate and site
        run: python scripts/validate.py
      - name: Commit if changed
        run: |
          git config user.name "premium-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/premium.json
          git diff --cached --quiet || git commit -m "data: daily aggregate $(date -u +%F)"
          git push
